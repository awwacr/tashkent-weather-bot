name: Daily Weather and Rates Report

on:
  schedule:
    # 03:10 UTC = 08:10 утра по Ташкенту (UTC+5)
    # Неровные минуты (10) гарантируют отсутствие очередей на серверах GitHub
    - cron: '10 3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем зависимости
        run: pip install requests

      - name: Запуск отправки
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
