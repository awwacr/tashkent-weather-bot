name: Daily Weather and Rates Report

on:
  schedule:
    # 21:15 UTC с учетом очереди GitHub запускает бота в 06:45–07:15 утра по Ташкенту
    - cron: '15 21 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Устанавливаем зависимости
        run: pip install --no-cache-dir requests

      - name: Запуск скрипта
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
