name: Daily Tashkent Report

on:
  schedule:
    - cron: '43 19 * * *'  # Сдвиг на 6 часов назад (вчерашний вечер по UTC), чтобы приходило к 07:00-07:30 утра в Ташкенте
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Fetch data and build docs/data.json
        run: python bot.py --fetch

      - name: Commit and push updated data.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "Update daily report data" && git push)

      - name: Wait for GitHub Pages deploy
        run: sleep 60

      - name: Send Telegram Web App notification
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: python bot.py --send
