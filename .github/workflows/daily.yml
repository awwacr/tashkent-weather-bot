name: Daily Weather and Rates Report

on:
  schedule:
    # Оставляем старое проверенное время, чтобы приходило утром!
    - cron: '45 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Устанавливаем зависимости
        run: pip install --no-cache-dir requests

      - name: Запуск скрипта
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
        run: python bot.py
