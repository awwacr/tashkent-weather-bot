name: Daily Weather and Rates Report

on:
  schedule:
    # 22:45 UTC = 03:45 по Ташкенту (с учетом очереди придет около 06:45-07:15)
    - cron: '45 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Устанавливаем зависимости
        # ДОБАВЛЕН deep-translator ДЛЯ ПЕРЕВОДА ФАКТОВ
        run: pip install --no-cache-dir requests deep-translator

      - name: Запуск скрипта
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
